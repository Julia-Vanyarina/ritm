<!doctype html>
<html lang="ru" data-theme="pink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ритм">
<meta name="theme-color" content="#fdf3f5">
<title>Ритм</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --ink:#3a3340; --muted:#8a8291; --line:#ece6ee; --card:#ffffff;
  --p:#ef9f97; --f:#eec765; --c:#86bce6; --ok:#7fb88a; --warn:#e39a6b;
  --r:20px; --shadow:0 6px 22px rgba(80,60,90,.07);
  --font: ui-rounded, -apple-system, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
}
[data-theme=pink]  {--bg:#fdf3f5;--accent:#e48aa3;--soft:#fbe2e9;--deep:#c4637f}
[data-theme=blue]  {--bg:#f1f6fc;--accent:#79a6d8;--soft:#dce8f7;--deep:#4f81b9}
[data-theme=green] {--bg:#f1f8f2;--accent:#7bb586;--soft:#dcefde;--deep:#4f9160}
[data-theme=yellow]{--bg:#fdf9ec;--accent:#d6ae42;--soft:#f7ebc6;--deep:#a9841f}
[data-theme=lilac] {--bg:#f6f2fb;--accent:#a68bd6;--soft:#e7ddf7;--deep:#7d61b3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 16px}
h1{font-size:26px;margin:6px 2px 12px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;font-weight:600}
.btn.soft{background:var(--soft);color:var(--deep)}
.btn.ghost{background:transparent;color:var(--deep);padding:8px 10px}
.btn.danger{background:#fbe3dc;color:#b6573a}
.btn.wide{width:100%}
.btn:active{transform:scale(.98)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--deep);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:13px;color:var(--muted);margin:0 0 4px 4px}
.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;outline:none}
.inp:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.list>div{padding:10px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.kcal{font-weight:700;white-space:nowrap}
/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabbar button{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--deep)}
/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.datenav button{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:20px;color:var(--deep)}
.datenav .d{font-weight:700;font-size:18px;text-align:center}
/* summary */
.sum{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-size:24px}
.macro{margin-bottom:8px}
.macro .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.water{display:flex;gap:6px;flex-wrap:wrap}
.drop{width:30px;height:36px;color:var(--line)}
.drop.on{color:var(--c)}
.meal h2{display:flex;justify-content:space-between;align-items:center;margin:0}
.meal .add{color:var(--deep);font-weight:700;font-size:15px;padding:6px 4px}
.entry{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.entry .nm{flex:1;min-width:0}
.entry .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(40,30,50,.28);z-index:40;opacity:0;transition:opacity .2s}
.veil.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:41;padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease;max-width:560px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
.xclose{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--deep);font-size:15px;font-weight:700}
.sheet h1{padding-right:40px}
.sheet h1{font-size:21px;margin:4px 0 12px}
.res{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.res .nm{flex:1;min-width:0}
.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin:8px 0 14px}
.tot div{background:var(--card);border-radius:14px;padding:10px 4px}
.tot b{display:block;font-size:18px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:600;color:var(--deep);font-size:14px}
.seg button.on{background:#fff;box-shadow:var(--shadow)}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
/* lock */
.lock{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.dots{display:flex;gap:14px;margin:18px 0 26px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:26px;font-weight:600}
.pad button.x{background:transparent;box-shadow:none;font-size:18px;color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12px;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1;border-radius:12px;font-size:14px;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column}
.cal button.has{background:var(--soft);color:var(--deep);font-weight:700}
.cal button.today{outline:2px solid var(--accent)}
.cal button.sel{background:var(--accent);color:#fff}
.cal button .pts{display:flex;gap:2px;position:absolute;bottom:5px}
.cal button .pts i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.8}
.feel{display:flex;gap:6px}
.feel button{flex:1;font-size:26px;padding:6px 0;border-radius:12px;background:var(--card);filter:grayscale(1);opacity:.55}
.feel button.on{filter:none;opacity:1;background:var(--soft)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--soft);border-radius:14px;padding:10px 4px}
.stat b{display:block;font-size:20px;color:var(--deep)}
.themes{display:flex;gap:12px}
.themes button{width:42px;height:42px;border-radius:50%;border:3px solid transparent}
.themes button.on{border-color:var(--ink)}
video{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover}
svg text{font-family:var(--font)}
.empty{padding:18px 0 6px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ хранилище ============ */
const KEY = 'ritm_v1';
const MEALS = [['breakfast','Завтрак'],['lunch','Обед'],['dinner','Ужин'],['snack','Перекус']];
const THEMES = {pink:'#e48aa3',blue:'#79a6d8',green:'#7bb586',yellow:'#d6ae42',lilac:'#a68bd6'};
const FEELS = ['😣','🙁','😐','🙂','🤩'];
const DEF = () => ({
  profile:{sex:'f',age:'',height:'',weight:'',activity:1.375,goal:'maintain',kcalOverride:''},
  foods:{}, library:[], weights:[], workouts:[], water:{},
  workoutTypes:['Танцы','Йога','Вокал','Прогулка','Силовая','Растяжка'],
  settings:{theme:'pink',pinHash:'',waterGoal:8,bk:{pass:'',last:0},dirty:false}
});
let S;
try{ S = Object.assign(DEF(), JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){ S = DEF(); }
S.settings = Object.assign(DEF().settings, S.settings||{});
S.settings.bk = Object.assign(DEF().settings.bk, S.settings.bk||{}); { const o=S.settings.yd||{}; if(o.pass&&!S.settings.bk.pass) S.settings.bk.pass=o.pass; if(o.last&&!S.settings.bk.last) S.settings.bk.last=o.last; } delete S.settings.gh; delete S.settings.yd;
S.profile = Object.assign(DEF().profile, S.profile||{});
function save(markDirty=true){ if(markDirty) S.settings.dirty = true; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Не удалось сохранить: память заполнена'); } }
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ============ утилиты ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v??'').replace(',','.')); return isFinite(n) ? n : 0; };
const r0 = n => Math.round(n), r1 = n => String(Math.round(n*10)/10).replace('.',',');
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso = d => { const z = new Date(d); return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0'); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d = new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const dOf = s => new Date(s+'T12:00:00');
const fmtDay = s => { const t = today(); if(s===t) return 'Сегодня'; if(s===addDays(t,-1)) return 'Вчера'; if(s===addDays(t,1)) return 'Завтра';
  return dOf(s).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'}); };
const fmtShort = s => dOf(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.','');
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2200); }
function plural(n,a,b,c){ n=Math.abs(n)%100; const m=n%10; if(n>10&&n<20) return c; if(m>1&&m<5) return b; if(m===1) return a; return c; }

/* ============ норма ============ */
function lastWeight(){ const w=[...S.weights].sort((a,b)=>a.date<b.date?-1:1).pop(); return w?w.kg:num(S.profile.weight); }
function norms(){
  const p=S.profile, w=lastWeight(), h=num(p.height), a=num(p.age);
  let kcal=0, bmr=0;
  if(w&&h&&a){ bmr = 10*w + 6.25*h - 5*a + (p.sex==='m'?5:-161); kcal = bmr*num(p.activity||1.375);
    if(p.goal==='lose') kcal*=0.85; if(p.goal==='gain') kcal*=1.10; kcal=Math.max(kcal,bmr); }
  if(num(p.kcalOverride)>0) kcal=num(p.kcalOverride);
  kcal = r0(kcal/10)*10;
  const pr = w ? r0(w*1.4) : r0(kcal*0.2/4);
  const fat = r0(kcal*0.3/9);
  const carb = Math.max(0, r0((kcal - pr*4 - fat*9)/4));
  return {kcal, p:pr, f:fat, c:carb, bmr:r0(bmr), ready: kcal>0};
}
function dayTotals(d){
  const t={kcal:0,p:0,f:0,c:0};
  (S.foods[d]||[]).forEach(e=>{ t.kcal+=e.kcal; t.p+=e.p; t.f+=e.f; t.c+=e.c; });
  return t;
}

/* ============ навигация ============ */
const TABS = [
  ['food','Еда','<path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z" fill="currentColor" fill-rule="evenodd" opacity=".9"/>'],
  ['weight','Вес','<path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm7 3a5 5 0 0 0-4.6 3h3.1l1.9-2 .6.8L11.5 10h5.1A5 5 0 0 0 12 7Z" fill="currentColor"/>'],
  ['sport','Спорт','<path d="M13.5 4.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0ZM8 9.5l3-1.5 3 1 2.5 3-1.5 1-2-2-1 3 2.5 2.5V21h-2v-3.5L10 15l-1.5 6h-2l2-8.5L8 12l-1.5 2.5L5 13.5l3-4Z" fill="currentColor"/>'],
  ['more','Ещё','<path d="M5 10.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z" fill="currentColor"/>']
];
let tab='food', day=today(), calMonth=today().slice(0,7), selDay=today(), wRange=30;
function renderTabs(){ $('#tabbar').innerHTML = TABS.map(([k,l,ic])=>`<button data-act="tab" data-k="${k}" class="${tab===k?'on':''}"><svg viewBox="0 0 24 24">${ic}</svg>${l}</button>`).join(''); }
function render(){
  document.documentElement.dataset.theme = S.settings.theme;
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  renderTabs();
  $('#app').innerHTML = ({food:viewFood,weight:viewWeight,sport:viewSport,more:viewMore})[tab]();
}

/* ============ ЕДА ============ */
function ringSVG(val,max,size=120,stroke=12,color='var(--accent)'){
  const r=(size-stroke)/2, C=2*Math.PI*r, k=max?Math.min(val/max,1):0, over=max&&val>max;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="${stroke}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${over?'var(--warn)':color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C*k} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
function macroBar(lbl,v,max,col){ const k=max?Math.min(v/max,1)*100:0;
  return `<div class="macro"><div class="lbl"><span>${lbl}</span><span class="muted">${r0(v)}${max?' / '+max:''} г</span></div><div class="bar"><i style="width:${k}%;background:${col}"></i></div></div>`; }
function viewFood(){
  const n=norms(), t=dayTotals(day), items=S.foods[day]||[];
  const left=n.kcal-t.kcal;
  const favs=[...S.library].filter(x=>x.fav).sort((a,b)=>(b.uses||0)-(a.uses||0)).slice(0,10);
  const water=S.water[day]||0, wg=S.settings.waterGoal||8;
  let h=`<div class="datenav"><button data-act="day" data-n="-1">‹</button><div class="d" data-act="today">${fmtDay(day)}<div class="small muted" style="font-weight:500">${dOf(day).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</div></div><button data-act="day" data-n="1">›</button></div>`;
  const bk=S.settings.bk, hasData=Object.keys(S.foods).length+S.weights.length+S.workouts.length>0;
  if(hasData && S.settings.dirty && Date.now()-(bk.last||0)>7*864e5) h+=`<button class="card row" data-act="share" style="width:100%;text-align:left;background:var(--soft);color:var(--deep)"><span style="font-size:22px">☁︎</span><span class="grow small"><b>${bk.last?'Копии не было больше недели':'Копия ещё не сделана'}</b><br>Нажмите и сохраните файл на Яндекс Диск</span></button>`;
  h+=`<div class="card"><div class="sum"><div class="ring">${ringSVG(t.kcal,n.kcal)}<div class="t"><b>${r0(t.kcal)}</b><span class="small muted">${n.ready?'из '+n.kcal:'ккал'}</span></div></div><div class="grow">`;
  h+= n.ready ? `<div style="font-weight:700;margin-bottom:8px">${left>=0?'Осталось '+r0(left)+' ккал':'Больше нормы на '+r0(-left)+' ккал'}</div>`
              : `<button class="btn soft" data-act="tab" data-k="more" style="margin-bottom:8px;padding:8px 12px;font-size:14px">Рассчитать норму</button>`;
  h+= macroBar('Белки',t.p,n.ready?n.p:0,'var(--p)')+macroBar('Жиры',t.f,n.ready?n.f:0,'var(--f)')+macroBar('Углеводы',t.c,n.ready?n.c:0,'var(--c)');
  h+=`</div></div></div>`;
  h+=`<div class="card"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">Вода</h2><span class="muted small">${water} из ${wg} стаканов · ${String(water*0.25).replace('.',',')} л</span></div><div class="water">`;
  for(let i=1;i<=Math.max(wg,water);i++) h+=`<button class="drop ${i<=water?'on':''}" data-act="water" data-n="${i}" aria-label="стакан ${i}"><svg viewBox="0 0 24 30"><path d="M12 2C8 8 4 13 4 18a8 8 0 0 0 16 0c0-5-4-10-8-16Z" fill="currentColor"/></svg></button>`;
  h+=`</div></div>`;
  if(favs.length) h+=`<div style="margin:0 2px 8px" class="small muted">Избранное — в один тап</div><div class="chips" style="margin-bottom:12px">${favs.map(f=>`<button class="chip" data-act="quick" data-id="${f.id}">★ ${esc(f.name)}</button>`).join('')}</div>`;
  for(const [m,lbl] of MEALS){
    const list=items.filter(e=>e.meal===m), sum=list.reduce((a,e)=>a+e.kcal,0);
    const y=(S.foods[addDays(day,-1)]||[]).filter(e=>e.meal===m);
    h+=`<div class="card meal"><h2><span>${lbl} <span class="muted small" style="font-weight:500">${sum?r0(sum)+' ккал':''}</span></span><button class="add" data-act="add" data-meal="${m}">+ Добавить</button></h2>`;
    list.forEach(e=>{ h+=`<button class="entry" data-act="edit" data-id="${e.id}"><div class="nm"><div>${esc(e.name)}</div><div class="small muted">${e.unit==='pc'?r1(e.qty)+' порц.':r0(e.qty)+' г'} · Б ${r0(e.p)} · Ж ${r0(e.f)} · У ${r0(e.c)}</div></div><span class="kcal">${r0(e.kcal)}</span></button>`; });
    if(!list.length && y.length) h+=`<button class="btn ghost small" data-act="repeat" data-meal="${m}" style="margin-top:6px">↻ Как вчера (${r0(y.reduce((a,e)=>a+e.kcal,0))} ккал)</button>`;
    h+=`</div>`;
  }
  h+=`<div class="card"><h2>Неделя</h2>${weekChart(n.kcal)}</div>`;
  return h;
}
function weekChart(norm){
  const days=[...Array(7)].map((_,i)=>addDays(day,i-6)), vals=days.map(d=>dayTotals(d).kcal);
  const W=320,H=150,pad=22, max=Math.max(norm||0,...vals,500)*1.12, bw=(W-pad)/7;
  let s=`<svg viewBox="0 0 ${W} ${H+24}" width="100%">`;
  if(norm){ const y=H-(norm/max)*H; s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".7"/><text x="${W}" y="${y-5}" text-anchor="end" font-size="11" fill="var(--muted)">норма ${norm}</text>`; }
  days.forEach((d,i)=>{ const v=vals[i], h=(v/max)*H, x=pad/2+i*bw+bw*0.18, w=bw*0.64;
    s+=`<rect x="${x}" y="${H-h}" width="${w}" height="${Math.max(h,2)}" rx="6" fill="${d===day?'var(--accent)':'var(--soft)'}"/>`;
    if(v) s+=`<text x="${x+w/2}" y="${H-h-5}" text-anchor="middle" font-size="10" fill="var(--muted)">${r0(v)}</text>`;
    s+=`<text x="${x+w/2}" y="${H+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${dOf(d).toLocaleDateString('ru-RU',{weekday:'short'})}</text>`; });
  return s+`</svg>`;
}

let sheetEl=null, veilEl=null, scanReader=null;
function openSheet(html){
  closeSheet(true);
  veilEl=document.createElement('div'); veilEl.className='veil'; veilEl.onclick=()=>closeSheet();
  sheetEl=document.createElement('div'); sheetEl.className='sheet'; sheetEl.innerHTML='<div class="grab"></div><button class="xclose" data-act="close" aria-label="Закрыть">✕</button>'+html;
  document.body.append(veilEl,sheetEl);
  requestAnimationFrame(()=>{ veilEl.classList.add('show'); sheetEl.classList.add('show'); });
  return sheetEl;
}
function closeSheet(instant){
  stopScan();
  const v=veilEl,s=sheetEl; veilEl=sheetEl=null; if(!s) return;
  if(instant){ v.remove(); s.remove(); return; }
  v.classList.remove('show'); s.classList.remove('show'); setTimeout(()=>{v.remove();s.remove();},250);
}
let addMeal='breakfast', offResults=[];
function openAdd(meal){
  addMeal=meal||guessMeal();
  const sh=openSheet(`<h1>Добавить еду</h1>
   <div class="row" style="margin-bottom:10px"><input class="inp grow" id="q" placeholder="Название продукта или блюда" autocomplete="off" enterkeyhint="search"><button class="btn soft" data-act="scan" aria-label="Сканировать штрихкод" style="padding:11px 13px">▥</button></div>
   <div id="scanbox"></div>
   <div id="results"></div>
   <button class="btn soft wide" data-act="manual" style="margin-top:6px">+ Своё блюдо вручную</button>`);
  const q=sh.querySelector('#q');
  q.addEventListener('input',()=>renderResults(q.value,false));
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); searchOFF(q.value); }});
  renderResults('',false);

function guessMeal(){ const h=new Date().getHours(); return h<11?'breakfast':h<16?'lunch':h<21?'dinner':'snack'; }
function renderResults(q,keepOff){
  const box=sheetEl&&sheetEl.querySelector('#results'); if(!box) return;
  if(!keepOff) offResults=[];
  const ql=q.trim().toLowerCase();
  let local=[...S.library];
  local = ql ? local.filter(x=>x.name.toLowerCase().includes(ql)) : local.sort((a,b)=>(b.last||0)-(a.last||0));
  local=local.slice(0,ql?20:12);
  let h='';
  if(local.length) h+=`<div class="small muted" style="margin:6px 4px">${ql?'Мои продукты':'Недавние'}</div>`+local.map(x=>resRow(x,'lib')).join('');
  if(ql) h+=`<button class="btn wide" data-act="off" style="margin:6px 0 10px">Найти «${esc(q.trim())}» в базе продуктов</button>`;
  if(offResults.length) h+=`<div class="small muted" style="margin:6px 4px">База Open Food Facts · значения на 100 г</div>`+offResults.map((x,i)=>resRow(x,'off',i)).join('');
  if(!h) h=`<div class="empty">Начните вводить название — или отсканируйте штрихкод.<br>Своё блюдо можно добавить вручную.</div>`;
  box.innerHTML=h;
}
function resRow(x,src,i){
  const per = x.per==='pc' ? 'за порцию' : 'на 100 г';
  return `<button class="res" data-act="pick" data-src="${src}" data-id="${src==='lib'?x.id:i}"><div class="nm"><div style="font-weight:600">${x.fav?'★ ':''}${esc(x.name)}</div><div class="small muted">${esc(x.brand||'')}${x.brand?' · ':''}Б ${r1(x.p)} · Ж ${r1(x.f)} · У ${r1(x.c)} ${per}</div></div><span class="kcal">${r0(x.kcal)}</span></button>`;
}
function offToItem(p){
  const n=p.nutriments||{};
  let kcal=n['energy-kcal_100g']; if(kcal==null && n['energy_100g']!=null) kcal=n['energy_100g']/4.184;
  return {name:(p.product_name_ru||p.product_name||'Без названия').trim(), brand:(p.brands||'').split(',')[0].trim(), code:p.code||'',
    per:100, kcal:num(kcal), p:num(n.proteins_100g), f:num(n.fat_100g), c:num(n.carbohydrates_100g), portion:num(p.serving_quantity)||100};
}
async function searchOFF(q){
  q=q.trim(); if(!q) return;
  if(!navigator.onLine){ toast('Нет интернета — поиск по базе недоступен'); return; }
  const box=sheetEl.querySelector('#results'); const btn=box.querySelector('[data-act=off]'); if(btn){ btn.textContent='Ищу…'; btn.disabled=true; }
  try{
    const url=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&lc=ru&fields=code,product_name,product_name_ru,brands,nutriments,serving_quantity`;
    const r=await fetch(url); const j=await r.json();
    offResults=(j.products||[]).map(offToItem).filter(x=>x.kcal>0);
    if(!offResults.length) toast('В базе ничего не нашлось — добавьте вручную');
  }catch(e){ toast('База продуктов не ответила, попробуйте ещё раз'); }
  renderResults(q,true);
}
async function lookupBarcode(code){
  toast('Ищу продукт…');
  const local=S.library.find(x=>x.code===code); if(local){ openPortion({...local}, null); return; }
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_ru,brands,nutriments,serving_quantity`);
    const j=await r.json();
    if(j.status===1 && j.product){ const it=offToItem(j.product); it.code=code; openPortion(it,null); }
    else { toast('Этого штрихкода нет в базе — заполните вручную'); openManual({code}); }
  }catch(e){ toast('Нет связи с базой продуктов'); openManual({code}); }
}
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.append(s); }); }
async function startScan(){
  const box=sheetEl.querySelector('#scanbox');
  if(scanReader){ stopScan(); box.innerHTML=''; return; }
  box.innerHTML=`<video id="vid" playsinline muted autoplay></video><div class="row" style="margin:8px 0 12px"><input class="inp grow" id="code" inputmode="numeric" placeholder="или введите цифры штрихкода"><button class="btn soft" data-act="codego">Найти</button></div>`;
  try{
    if(!window.ZXing) await loadScript('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js');
    scanReader=new ZXing.BrowserMultiFormatReader();
    await scanReader.decodeFromVideoDevice(undefined, box.querySelector('#vid'), (res)=>{
      if(res){ const code=res.getText(); stopScan(); if(navigator.vibrate) navigator.vibrate(60); lookupBarcode(code); }
    });
  }catch(e){ stopScan(); box.querySelector('video')?.remove(); toast('Камера недоступна — введите цифры штрихкода'); }
}
function stopScan(){ if(scanReader){ try{ scanReader.reset(); }catch(e){} scanReader=null; } }

function weekAvg(endIso){ const from=addDays(endIso,-6); const xs=S.weights.filter(w=>w.date>=from&&w.date<=endIso).map(w=>w.kg); return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0; }
function viewWeight(){
  const ws=[...S.weights].sort((a,b)=>a.date<b.date?-1:1);
  const t=today(), a1=weekAvg(t), a0=weekAvg(addDays(t,-7)), last=ws[ws.length-1];

  h+=`<div class="card"><div class="stat"><div><b>${last?r1(last.kg):'—'}</b><span class="small muted">последний</span></div><div><b>${a1?r1(a1):'—'}</b><span class="small muted">среднее за 7 дн.</span></div><div><b>${a1&&a0?(a1-a0>0?'+':'')+r1(a1-a0):'—'}</b><span class="small muted">к прошлой неделе</span></div></div>

  <details><summary class="small muted" style="margin:0 4px 8px">Замеры (по желанию)</summary><div class="grid2">${[['waist','Талия, см'],['hips','Бёдра, см'],['chest','Грудь, см'],['arm','Рука, см']].map(([k,l])=>`<label class="field"><span>${l}</span><input class="inp" data-w="${k}" inputmode="decimal"></label>`).join('')}</div></details>

  h+=`<div class="card"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">График</h2><div class="chips">${[[30,'Месяц'],[90,'3 мес.'],[365,'Год']].map(([d,l])=>`<button class="chip ${wRange===d?'on':''}" data-act="wrange" data-n="${d}">${l}</button>`).join('')}</div></div>${weightChart(ws)}</div>`;
  if(ws.length){ h+=`<div class="card"><h2>История</h2><div class="list">`+ws.slice().reverse().slice(0,60).map(w=>{
      const m=['waist','hips','chest','arm'].filter(k=>w[k]).map(k=>({waist:'талия',hips:'бёдра',chest:'грудь',arm:'рука'})[k]+' '+w[k]).join(' · ');
      return `<div class="row"><div class="grow"><b>${r1(w.kg)} кг</b><div class="small muted">${fmtShort(w.date)}${m?' · '+m:''}</div></div><button class="btn ghost" data-act="delweight" data-d="${w.date}" aria-label="удалить">✕</button></div>`; }).join('')+`</div></div>`; }

function weightChart(ws){
  const from=addDays(today(),-wRange+1), pts=ws.filter(w=>w.date>=from);
  if(pts.length<2) return `<div class="empty">Нужно хотя бы две записи, чтобы нарисовать график.</div>`;
  const W=330,H=170,L=34,B=22, t0=dOf(from).getTime(), t1=dOf(today()).getTime();
  const kgs=pts.map(p=>p.kg), mn=Math.min(...kgs)-0.6, mx=Math.max(...kgs)+0.6;
  const X=d=>L+(dOf(d).getTime()-t0)/(t1-t0||1)*(W-L-6), Y=v=>6+(1-(v-mn)/(mx-mn))*(H-B-6);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let i=0;i<=3;i++){ const v=mn+(mx-mn)*i/3, y=Y(v); s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-5}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${r1(v)}</text>`; }
  const avg=pts.map(p=>({d:p.date,v:weekAvg(p.date)}));
  s+=`<path d="${avg.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach(p=>{ s+=`<circle cx="${X(p.date)}" cy="${Y(p.kg)}" r="3" fill="var(--card)" stroke="var(--deep)" stroke-width="1.5" opacity=".7"/>`; });
  s+=`<text x="${L}" y="${H-5}" font-size="10" fill="var(--muted)">${fmtShort(from)}</text><text x="${W-4}" y="${H-5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtShort(today())}</text>`;
  return s+`</svg><div class="row small muted" style="gap:14px;margin-top:4px"><span><b style="color:var(--accent)">━</b> среднее за неделю</span><span>○ взвешивания</span></div>`;
}

   <div class="grid2"><label class="field"><span>Дата</span><input class="inp" type="date" id="wdate" value="${w.date}"></label><label class="field"><span>Минут</span><input class="inp" id="wmin" inputmode="numeric" value="${w.minutes}"></label></div>

   <div class="field"><span>Как ощущения</span><div class="feel">${FEELS.map((f,i)=>`<button data-act="wfeel" data-n="${i+1}" class="${w.feel===i+1?'on':''}">${f}</button>`).join('')}</div></div>
   <label class="field"><span>Заметка</span><textarea class="inp" id="wnote" rows="2" placeholder="Что получилось, что болело, что разучили">${esc(w.note)}</textarea></label>
   <button class="btn wide" data-act="savew">Сохранить</button>${id?'<button class="btn danger wide" data-act="delw" style="margin-top:8px">Удалить</button>':''}`);
  sh._w={...w,id:id||null};
}

   ${n.ready?`<div class="tot"><div><b>${n.kcal}</b><span class="small muted">ккал</span></div><div><b>${n.p}</b><span class="small muted">белки</span></div><div><b>${n.f}</b><span class="small muted">жиры</span></div><div><b>${n.c}</b><span class="small muted">углев.</span></div></div>
   <p class="small muted" style="margin:0 4px">Расчёт по формуле Миффлина — Сан Жеора. Для снижения — мягкий дефицит 15%, и норма никогда не опускается ниже базового обмена (${n.bmr} ккал). Это ориентир, а не правило: если чувствуете усталость или постоянный голод, норму стоит поднять.</p>`:`<p class="small muted" style="margin:0 4px">Заполните возраст, рост и вес — посчитаю норму.</p>`}
  </div>`;
  h+=`<div class="card"><h2>Оформление</h2><div class="themes">${Object.entries(THEMES).map(([k,c])=>`<button data-act="theme" data-k="${k}" class="${S.settings.theme===k?'on':''}" style="background:${c}" aria-label="${k}"></button>`).join('')}</div>
   <label class="field" style="margin-top:12px"><span>Цель по воде, стаканов (250 мл)</span><input class="inp" id="wg" inputmode="numeric" value="${S.settings.waterGoal}"></label></div>`;
  h+=`<div class="card"><h2>Тренировки</h2><label class="field"><span>Виды занятий через запятую</span><input class="inp" id="wtypes" value="${esc(S.workoutTypes.join(', '))}"></label><button class="btn soft" data-act="savetypes">Сохранить список</button></div>`;
  h+=`<div class="card"><h2>PIN-код</h2><p class="small muted" style="margin:0 0 10px">${S.settings.pinHash?'Приложение закрыто PIN-кодом. Он защищает от чужих глаз, если телефон окажется в чужих руках разблокированным.':'Сейчас приложение открывается без PIN-кода.'}</p>
   <div class="row"><button class="btn soft" data-act="setpin">${S.settings.pinHash?'Сменить PIN':'Поставить PIN'}</button>${S.settings.pinHash?'<button class="btn ghost" data-act="offpin">Убрать</button>':''}</div></div>`;
  h+=`<div class="card"><h2>Резервная копия</h2>
   <p class="small muted" style="margin:0 0 10px">Нажмите «Сохранить копию» → «Сохранить в Файлы» → Яндекс Диск → папка «Ритм». Если копии нет больше недели, на главном экране появится напоминание.</p>

   <p class="small muted" style="margin:10px 4px 12px">${g.last?'Последняя копия: '+new Date(g.last).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'Копий пока не было.'}</p>
   <label class="field"><span>Пароль шифрования (по желанию — запишите его!)</span><input class="inp" id="bkp" type="password" value="${esc(g.pass)}" autocapitalize="off" autocorrect="off" placeholder="без пароля копия не шифруется"></label>
   <label class="btn soft wide center" style="display:block">Восстановить из копии<input type="file" id="imp" accept=".json,application/json" hidden></label></div>`;
  h+=`<p class="center small muted">Ритм · данные хранятся только на этом телефоне</p>`;
  return h;
}

/* ============ PIN ============ */
async function sha(s){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function pinScreen(title, onDone, cancelable){
  const el=document.createElement('div'); el.className='lock';
  let v='';
  el.innerHTML=`<div style="font-size:40px">🌿</div><h2 style="margin:10px 0 0">${title}</h2><div class="dots">${'<i></i>'.repeat(4)}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button class="x" data-d="c">${cancelable?'Отмена':''}</button><button data-d="0">0</button><button class="x" data-d="b">⌫</button></div>`;
  const dots=()=>el.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<v.length));
  el.addEventListener('click',async e=>{ const b=e.target.closest('button'); if(!b) return; const d=b.dataset.d;
    if(d==='b') v=v.slice(0,-1); else if(d==='c'){ if(cancelable) el.remove(); return; } else if(v.length<4) v+=d;
    dots();
    if(v.length===4){ const ok=await onDone(v); if(ok) el.remove(); else { const ds=el.querySelector('.dots'); ds.classList.add('shake'); setTimeout(()=>{ds.classList.remove('shake'); v=''; dots();},380); } } });
  document.body.append(el); return el;
}
let locked=false;
function lockIfNeeded(){
  if(!S.settings.pinHash || locked) return; locked=true;
  pinScreen('Введите PIN', async v=>{ const ok=(await sha('ritm:'+v))===S.settings.pinHash; if(ok){ locked=false; } return ok; }, false);
}
function setPin(){
  pinScreen('Новый PIN', async v1=>{
    setTimeout(()=>pinScreen('Повторите PIN', async v2=>{ if(v1!==v2){ toast('PIN не совпал'); return false; }
      S.settings.pinHash=await sha('ritm:'+v2); save(false); render(); toast('PIN поставлен'); return true; }, true),50);
    return true; }, true);
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{ if(document.hidden) hiddenAt=Date.now(); else { if(hiddenAt && Date.now()-hiddenAt>2*60*1000) lockIfNeeded(); if(day!==today() && hiddenAt && Date.now()-hiddenAt>3*3600*1000){ day=today(); render(); } } });

/* ============ шифрование и Яндекс Диск ============ */
const b64 = buf => { const a=new Uint8Array(buf); let s=''; for(let i=0;i<a.length;i+=8192) s+=String.fromCharCode(...a.subarray(i,i+8192)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function keyFrom(pass,salt){ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
function payload(){ const c=JSON.parse(JSON.stringify(S)); c.settings.bk=DEF().settings.bk; c.settings.pinHash=''; c.exported=new Date().toISOString(); return JSON.stringify(c); }
async function encrypt(text,pass){ const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await keyFrom(pass,salt),new TextEncoder().encode(text));
  return JSON.stringify({app:'ritm',v:1,encrypted:true,salt:b64(salt),iv:b64(iv),data:b64(ct),saved:new Date().toISOString()}); }
async function decrypt(env,pass){ const o=typeof env==='string'?JSON.parse(env):env;
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await keyFrom(pass,unb64(o.salt)),unb64(o.data));
  return new TextDecoder().decode(pt); }
async function backupText(){ const pass=S.settings.bk.pass; return pass ? encrypt(payload(),pass) : payload(); }
async function importText(text, pass){
  let o=JSON.parse(text);
  if(o.app==='ritm' && o.encrypted){
    pass = pass || prompt('Копия зашифрована. Введите пароль шифрования:') || '';
    try{ o=JSON.parse(await decrypt(o,pass)); }catch(e){ throw new Error('неверный пароль шифрования'); }
  }
  if(!o.foods && !o.weights) throw new Error('это не копия Ритма');
  applyImport(o);
}
function applyImport(o){
  const keep={bk:S.settings.bk,pinHash:S.settings.pinHash};
  S=Object.assign(DEF(),o); delete S.exported; S.settings=Object.assign(DEF().settings,o.settings||{},keep); delete S.settings.gh; delete S.settings.yd; S.profile=Object.assign(DEF().profile,o.profile||{});
  save(false); render();
}
async function shareBackup(){
  let text; try{ text=await backupText(); }catch(e){ toast('Не удалось подготовить копию'); return; }
  const name='ritm-backup.json', file=new File([text],name,{type:'application/json'});
  const done=()=>{ S.settings.bk.last=Date.now(); S.settings.dirty=false; save(false); render(); };
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); done(); toast('Копия сохранена'); }
    catch(e){ if(e.name!=='AbortError') toast('Не получилось: '+e.message); }
  } else { const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); done(); }
}

/* ============ события ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, d=b.dataset;
  const A={
    tab(){ tab=d.k; render(); scrollTo(0,0); },
    close(){ closeSheet(); },
    day(){ day=addDays(day,+d.n); render(); },
    today(){ day=today(); render(); },
    water(){ const n=+d.n, w=S.water[day]||0; S.water[day]= n===w ? n-1 : n; save(); render(); },
    add(){ openAdd(d.meal); },
    quick(){ const it=S.library.find(x=>x.id===d.id); if(!it) return; addMeal=guessMeal(); openPortion({...it},null,it.portion); },
    edit(){ const e_=S.foods[day].find(x=>x.id===d.id); const lib=S.library.find(x=>x.id===e_.libId);
      const k=e_.unit==='pc'?e_.qty:e_.qty/100; const base=lib?{...lib}:{name:e_.name,per:e_.unit==='pc'?'pc':100,kcal:e_.kcal/k,p:e_.p/k,f:e_.f/k,c:e_.c/k};
      openPortion(base,e_.id,e_.qty); },
    repeat(){ const y=(S.foods[addDays(day,-1)]||[]).filter(x=>x.meal===d.meal); S.foods[day]=(S.foods[day]||[]).concat(y.map(x=>({...x,id:uid()}))); save(); render(); toast('Скопировано со вчера'); },
    scan(){ startScan(); },
    codego(){ const c=sheetEl.querySelector('#code').value.replace(/\D/g,''); if(c) { stopScan(); lookupBarcode(c); } },
    off(){ searchOFF(sheetEl.querySelector('#q').value); },
    pick(){ const it=d.src==='lib'?{...S.library.find(x=>x.id===d.id)}:{...offResults[+d.id]}; openPortion(it,null); },
    manual(){ openManual({name:sheetEl.querySelector('#q')?.value||''}); },
    per(){ sheetEl._per=d.k; sheetEl.querySelectorAll('#mper button').forEach(x=>x.classList.toggle('on',x===b)); },
    manualnext: manualNext,
    meal(){ sheetEl._meal=d.k; sheetEl.querySelectorAll('[data-act=meal]').forEach(x=>x.classList.toggle('on',x===b)); },
    g(){ sheetEl.querySelector('#qty').value=d.g; sheetEl._upd(); },
    savefood: saveFood,
    delfood(){ S.foods[day]=S.foods[day].filter(x=>x.id!==cur.entryId); save(); closeSheet(); render(); toast('Удалено'); },
    wrange(){ wRange=+d.n; render(); },
    saveweight(){ const kg=num($('#wk').value), dt=$('#wd').value||today(); if(kg<20||kg>400){ toast('Проверьте вес'); return; }
      const rec={date:dt,kg}; document.querySelectorAll('[data-w]').forEach(i=>{ const v=num(i.value); if(v) rec[i.dataset.w]=v; });
      S.weights=S.weights.filter(w=>w.date!==dt); S.weights.push(rec); save(); render(); toast('Записано'); },
    delweight(){ if(confirm('Удалить запись?')){ S.weights=S.weights.filter(w=>w.date!==d.d); save(); render(); } },
    mon(){ const [y,m]=calMonth.split('-').map(Number); const n=new Date(y,m-1+(+d.n),1); calMonth=iso(n).slice(0,7); render(); },
    selday(){ selDay=d.d; render(); },
    addw(){ openWorkout(null); }, editw(){ openWorkout(d.id); },
    wtype(){ sheetEl._w.type=d.t; sheetEl.querySelectorAll('[data-act=wtype]').forEach(x=>x.classList.toggle('on',x===b)); },
    wtypenew(){ const t=(prompt('Название занятия')||'').trim(); if(!t) return; if(!S.workoutTypes.includes(t)){ S.workoutTypes.push(t); save(); } sheetEl._w.type=t;
      b.insertAdjacentHTML('beforebegin',`<button class="chip" data-act="wtype" data-t="${esc(t)}">${esc(t)}</button>`); sheetEl.querySelectorAll('[data-act=wtype]').forEach(x=>x.classList.toggle('on',x.dataset.t===t)); },
    wm(){ sheetEl.querySelector('#wmin').value=d.m; },
    wfeel(){ sheetEl._w.feel=+d.n; sheetEl.querySelectorAll('[data-act=wfeel]').forEach(x=>x.classList.toggle('on',x===b)); },
    savew(){ const w=sheetEl._w; w.date=sheetEl.querySelector('#wdate').value||selDay; w.minutes=num(sheetEl.querySelector('#wmin').value); w.note=sheetEl.querySelector('#wnote').value.trim();
      if(!w.id){ w.id=uid(); S.workouts.push(w); } else { const i=S.workouts.findIndex(x=>x.id===w.id); S.workouts[i]=w; }
      selDay=w.date; calMonth=w.date.slice(0,7); save(); closeSheet(); render(); toast('Сохранено'); },
    delw(){ S.workouts=S.workouts.filter(x=>x.id!==sheetEl._w.id); save(); closeSheet(); render(); },
    pf(){ S.profile[d.f]=d.v; save(); render(); },
    theme(){ S.settings.theme=d.k; save(false); render(); },
    savetypes(){ S.workoutTypes=$('#wtypes').value.split(',').map(s=>s.trim()).filter(Boolean); save(); toast('Сохранено'); },
    setpin: setPin,
    offpin(){ pinScreen('Текущий PIN', async v=>{ if((await sha('ritm:'+v))!==S.settings.pinHash) return false; S.settings.pinHash=''; save(false); render(); toast('PIN убран'); return true; }, true); },
    share: shareBackup,
    export(){ shareBackup(); }
  };
  if(A[a]){ e.preventDefault(); A[a](); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.p){ S.profile[t.dataset.p]=t.value; save(); render(); }
  if(t.id==='wg'){ S.settings.waterGoal=Math.max(1,Math.min(20,r0(num(t.value))||8)); save(false); }
  if(t.id==='bkp'){ S.settings.bk.pass=t.value; save(false); }
  if(t.id==='imp' && t.files[0]){ t.files[0].text().then(async x=>{ if(!confirm('Заменить данные на телефоне данными из файла?')) return; await importText(x, S.settings.bk.pass); toast('Данные загружены'); }).catch(e=>toast('Не получилось: '+(e.message||'файл не читается'))).finally(()=>{ t.value=''; }); }
});

/* ============ старт ============ */
render(); lockIfNeeded();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
